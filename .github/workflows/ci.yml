name: CI — Inventario de Cuellos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificar:
    name: Verificar código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Build
        run: npm run build --workspace=apps/web
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas web
        run: npm run test --workspace=apps/web -- --run

      - name: Ejecutar pruebas shared
        run: npm run test --workspace=packages/shared -- --run

  migraciones:
    name: Migraciones de base de datos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Misma versión que el devDependency "supabase" de package-lock.json,
      # para que la CI pruebe con el mismo CLI que se usa en local.
      # Si actualizas el CLI en package.json, actualiza también esta versión.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # Levanta un Postgres temporal dentro del runner y aplica todas las
      # migraciones de supabase/migrations + los seeds de config.toml.
      # Si alguna migración o seed tiene un error, este paso falla.
      # En el runner de GitHub el puerto 54322 ya está ocupado, así que solo
      # en la CI se mueve la BD a otro puerto. El config.toml del repo no cambia.
      - name: Usar puerto libre para la BD
        run: |
          sudo ss -ltnp | grep -E ':5432[0-9]' || echo "Nada escuchando en 5432x"
          sed -i 's/^port = 54322$/port = 64322/' supabase/config.toml
          grep -n '^port = 64322$' supabase/config.toml

      - name: Aplicar migraciones y seeds
        run: supabase db start

      - name: Detener base de datos
        if: always()
        run: supabase stop --no-backup
