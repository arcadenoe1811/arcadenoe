name: CI — Inventario de Cuellos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificar:
    name: Verificar código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Build
        run: npm run build --workspace=apps/web
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas web
        run: npm run test --workspace=apps/web -- --run

      - name: Ejecutar pruebas shared
        run: npm run test --workspace=packages/shared -- --run

  migraciones:
    name: Migraciones de base de datos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta un Postgres temporal dentro del runner y aplica todas las
      # migraciones de supabase/migrations + los seeds de config.toml.
      # Si alguna migración o seed tiene un error, este paso falla.
      - name: Aplicar migraciones y seeds
        run: supabase db start

      - name: Detener base de datos
        if: always()
        run: supabase stop --no-backup
