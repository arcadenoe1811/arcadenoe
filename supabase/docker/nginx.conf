# Expone PostgREST en /rest/v1/ y GoTrue en /auth/v1/ igual que Supabase,
# para que supabase-js funcione sin cambios.
server {
  listen 80;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # PostgREST y GoTrue responden CORS por su cuenta; no se agrega aqui.
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location = /salud {
    return 200 "ok";
  }
}
