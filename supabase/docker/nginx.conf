# Expone PostgREST en /rest/v1/ y GoTrue en /auth/v1/ igual que Supabase,
# para que supabase-js funcione sin cambios.

# Origenes que pueden llamar a la API desde un navegador: solo la app. A
# cualquier otro no se le devuelve la cabecera CORS (antes se reflejaba
# cualquier origen).
map $http_origin $origen_permitido {
  default "";
  "http://localhost:5173" $http_origin;
  "http://127.0.0.1:5173" $http_origin;
}

server {
  listen 80;
  server_tokens off;

  # PostgREST responde CORS correctamente por su cuenta.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # GoTrue NO acepta la cabecera `apikey` en su CORS (en Supabase real lo
  # resuelve el gateway Kong), asi que el navegador bloquea el login con
  # "Failed to fetch". Aqui el proxy responde el CORS y oculta el de GoTrue.
  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $origen_permitido always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Vary Origin always;
      return 204;
    }

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $origen_permitido always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "x-supabase-api-version" always;
    add_header Vary Origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location = /salud {
    return 200 "ok";
  }
}
