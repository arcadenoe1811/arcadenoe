# Stack local completo en Docker: `docker compose up -d --build`
# (o `npm run docker:iniciar`).
#
#   Frontend  -> web   : Vite + React en http://localhost:5173
#   Backend   -> api   : proxy en http://localhost:54321 que imita las rutas
#                        /rest/v1 (PostgREST) y /auth/v1 (GoTrue) de Supabase
#                rest, auth
#   BD        -> db    : PostgreSQL de Supabase en localhost:54322
#
# No incluye Studio (viene con la CLI de Supabase, ver README).
# No usar a la vez que `npx supabase start`: comparten puertos.
#
# Las migraciones solo se aplican la primera vez (volumen vacio).
# Para reaplicarlas: docker compose down -v && docker compose up -d

name: inventario-cuellos

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    ports:
      # Solo desde esta maquina: la base no se expone a la red local.
      - '127.0.0.1:54322:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXP: 3600
    volumes:
      - ./supabase/docker/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/migrations/00001_esquema_inicial.sql:/docker-entrypoint-initdb.d/migrations/90-00001.sql:ro
      - ./supabase/migrations/00002_acceso_autenticado.sql:/docker-entrypoint-initdb.d/migrations/90-00002.sql:ro
      - ./supabase/migrations/00003_tipos_y_posiciones.sql:/docker-entrypoint-initdb.d/migrations/90-00003.sql:ro
      - ./supabase/migrations/00004_colores_codigo_posicion.sql:/docker-entrypoint-initdb.d/migrations/90-00004.sql:ro
      - ./supabase/migrations/00005_colores_tono.sql:/docker-entrypoint-initdb.d/migrations/90-00005.sql:ro
      - ./supabase/migrations/00006_diseno_cuello.sql:/docker-entrypoint-initdb.d/migrations/90-00006.sql:ro
      - ./supabase/migrations/00007_piezas_herencia.sql:/docker-entrypoint-initdb.d/migrations/90-00007.sql:ro
      - ./supabase/migrations/00008_herencia_cruzada.sql:/docker-entrypoint-initdb.d/migrations/90-00008.sql:ro
      - ./supabase/migrations/00009_puno_del_cuello.sql:/docker-entrypoint-initdb.d/migrations/90-00009.sql:ro
      - ./supabase/migrations/00010_inventario_conos.sql:/docker-entrypoint-initdb.d/migrations/90-00010.sql:ro
      - ./supabase/migrations/00011_usuarios_roles_seguridad.sql:/docker-entrypoint-initdb.d/migrations/90-00011.sql:ro
      - ./supabase/migrations/00012_ventas_estimador_reportes.sql:/docker-entrypoint-initdb.d/migrations/90-00012.sql:ro
      - ./supabase/migrations/00013_estado_ventas.sql:/docker-entrypoint-initdb.d/migrations/90-00013.sql:ro
      - ./supabase/migrations/00014_produccion_dirigida.sql:/docker-entrypoint-initdb.d/migrations/90-00014.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/migrations/99-seed.sql:ro
      - ./supabase/seed_disenos.sql:/docker-entrypoint-initdb.d/migrations/99-zz-seed-disenos.sql:ro
      - ./supabase/seed_conos.sql:/docker-entrypoint-initdb.d/migrations/99-zz-seed-conos.sql:ro
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
      # Solo la app puede llamar a la API desde un navegador (CORS).
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173,http://127.0.0.1:5173
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # --- Seguridad (ver migracion 00011) ---
      # Una sesion sin uso durante 8 horas no se puede renovar.
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 8h
      # Los refresh tokens rotan; reutilizar uno viejo revoca la sesion.
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      # Bloqueo de la cuenta 15 minutos tras 5 contrasenas incorrectas.
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: 'true'
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/fn_hook_intento_contrasena

  # Crea el primer usuario (admin) cuando GoTrue ya creo sus tablas (una sola vez).
  semilla-usuario:
    image: supabase/postgres:15.8.1.060
    restart: 'no'
    depends_on:
      - auth
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/seed_usuario.sql:/semilla/seed_usuario.sql:ro
    entrypoint: ['sh', '-c']
    command:
      - >
        until psql -h db -U postgres -tAc "select to_regclass('auth.identities')" | grep -q identities;
        do echo "esperando a GoTrue..."; sleep 2; done;
        psql -h db -U postgres -v ON_ERROR_STOP=1 -f /semilla/seed_usuario.sql

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - rest
      - auth
    ports:
      - '54321:80'
    volumes:
      - ./supabase/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Frontend: servidor de desarrollo de Vite (React) con recarga en caliente.
  # El navegador habla con la API en http://localhost:54321 (servicio `api`).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:5173'
    environment:
      # En Windows/macOS los cambios en volumenes montados no siempre
      # disparan eventos; con polling Vite detecta las ediciones.
      USAR_POLLING: 'true'
    volumes:
      # Codigo del repo (incluye el .env de la raiz, que Vite lee con envDir).
      - .:/app
      # node_modules propios del contenedor (Linux), no los de Windows.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules

volumes:
  datos-db:
